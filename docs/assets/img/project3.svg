<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Background -->
  <rect width="800" height="400" fill="#f5f5f5"/>
  
  <!-- Weather App mockup -->
  <rect x="50" y="50" width="700" height="300" rx="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="50" y="50" width="700" height="60" rx="10" fill="#4285F4"/>
  <text x="100" y="85" font-family="Arial, sans-serif" font-size="20" fill="white">Weather Forecast App</text>
  
  <!-- Search Bar -->
  <rect x="400" y="65" width="300" height="30" rx="15" fill="white"/>
  <text x="420" y="85" font-family="Arial, sans-serif" font-size="14" fill="#757575">Search location...</text>
  
  <!-- Current Weather -->
  <rect x="80" y="130" width="300" height="200" rx="10" fill="#E1F5FE"/>
  
  <!-- Weather Icon (Sun) -->
  <circle cx="180" cy="180" r="40" fill="#FFEB3B"/>
  
  <!-- Temperature -->
  <text x="180" y="250" font-family="Arial, sans-serif" font-size="36" fill="#333" text-anchor="middle">24°C</text>
  <text x="180" y="280" font-family="Arial, sans-serif" font-size="18" fill="#333" text-anchor="middle">Sunny</text>
  
  <!-- Forecast Cards -->
  <rect x="400" y="130" width="80" height="120" rx="5" fill="#E3F2FD"/>
  <text x="440" y="155" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Mon</text>
  <circle cx="440" cy="180" r="15" fill="#FFEB3B"/>
  <text x="440" y="220" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">23°C</text>
  
  <rect x="490" y="130" width="80" height="120" rx="5" fill="#E3F2FD"/>
  <text x="530" y="155" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Tue</text>
  <circle cx="530" cy="180" r="15" fill="#FFEB3B"/>
  <text x="530" y="220" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">25°C</text>
  
  <rect x="580" y="130" width="80" height="120" rx="5" fill="#E3F2FD"/>
  <text x="620" y="155" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Wed</text>
  <path d="M605 180 Q620 165 635 180 Q620 195 605 180" fill="#BDBDBD"/>
  <text x="620" y="220" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">20°C</text>
  
  <rect x="670" y="130" width="80" height="120" rx="5" fill="#E3F2FD"/>
  <text x="710" y="155" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">Thu</text>
  <path d="M695 175 Q710 160 725 175 M695 185 Q710 170 725 185" fill="none" stroke="#BDBDBD" stroke-width="2"/>
  <text x="710" y="220" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">18°C</text>
  
  <!-- Weather Details -->
  <rect x="80" y="340" width="300" height="1" fill="#e0e0e0"/>
  <text x="100" y="360" font-family="Arial, sans-serif" font-size="14" fill="#757575">Humidity: 65%</text>
  <text x="250" y="360" font-family="Arial, sans-serif" font-size="14" fill="#757575">Wind: 5 km/h</text>
</svg>