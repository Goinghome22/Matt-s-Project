<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Background -->
  <rect width="800" height="400" fill="#f5f5f5"/>
  
  <!-- E-commerce mockup -->
  <rect x="50" y="50" width="700" height="300" rx="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="50" y="50" width="700" height="60" rx="10" fill="#4285F4"/>
  <text x="100" y="85" font-family="Arial, sans-serif" font-size="20" fill="white">E-Commerce Platform</text>
  
  <!-- Navigation -->
  <text x="400" y="85" font-family="Arial, sans-serif" font-size="16" fill="white">Home</text>
  <text x="480" y="85" font-family="Arial, sans-serif" font-size="16" fill="white">Products</text>
  <text x="580" y="85" font-family="Arial, sans-serif" font-size="16" fill="white">Cart</text>
  <text x="650" y="85" font-family="Arial, sans-serif" font-size="16" fill="white">Account</text>
  
  <!-- Product Grid -->
  <rect x="80" y="140" width="150" height="150" rx="5" fill="#e0e0e0"/>
  <rect x="260" y="140" width="150" height="150" rx="5" fill="#e0e0e0"/>
  <rect x="440" y="140" width="150" height="150" rx="5" fill="#e0e0e0"/>
  <rect x="620" y="140" width="100" height="150" rx="5" fill="#e0e0e0"/>
  
  <!-- Product Labels -->
  <rect x="80" y="300" width="150" height="20" fill="#4285F4"/>
  <rect x="260" y="300" width="150" height="20" fill="#4285F4"/>
  <rect x="440" y="300" width="150" height="20" fill="#4285F4"/>
  <rect x="620" y="300" width="100" height="20" fill="#4285F4"/>
</svg>