# =====================
# SITE BASICS
# =====================
title: "Matthew Rich — Junior Cybersecurity Analyst"
description: "Inspiring Junior Cybersecurity Analyst with a passion for analyzing, detecting, and protecting security systems from any potential threats."
url: "https://goinghome22.github.io" # The base hostname & protocol
baseurl: "/Matt-s-Project" # The subpath of your site

# =====================
# THEME (Modern)
# =====================
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

# =====================
# AUTHOR PROFILE
# =====================
author:
    name: "Matthew Rich"
    avatar: "/assets/img/matt_headshot.jpg"
    bio: "Inspiring Junior Cybersecurity Analyst with a passion for analyzing, detecting, and protecting security systems from any potential threats"
    email: "matthew.rich@student.fairfield.edu"
    links:
        - label: "GitHub"
          icon: "fab fa-github"
          url: "https://github.com/Goinghome22"
        - label: "LinkedIn"
          icon: "fab fa-linkedin"
          url: "https://www.linkedin.com/in/matthew-rich-15910a196"

# =====================
# NAVIGATION (top menu)
# =====================
# Navigation is configured in _data/navigation.yml for Minimal Mistakes theme

# =====================
# BRANDING
# =====================
logo: "/assets/img/dae-logo.jpg" # ← Fixed from .avif

# =====================
# PLUGINS (safe + GitHub Pages supported)
# =====================
plugins:
    - jekyll-feed
    - jekyll-seo-tag
    - jekyll-include-cache
    - jekyll-remote-theme

# =====================
# BUILD & MARKDOWN
# =====================
markdown: kramdown
highlighter: rouge
permalink: pretty

# =====================
# GLOBAL DEFAULTS (keeps layout consistent)
# =====================
# These defaults apply Minimal Mistakes' single-page layout with a sticky ToC.
# They won't break Minima; Minima ignores unknown front matter values.
defaults:
    - scope:
          path: ""
          type: "pages"
      values:
          layout: single
          toc: true
          toc_sticky: true
          author_profile: true

# =====================
# EXCLUDES (keep the build clean)
# =====================
# GitHub Pages handles these exclusions automatically
